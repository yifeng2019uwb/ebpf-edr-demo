# Network detections — lsm-connect (lsm/socket_connect).
# Sees: dst_ip, dst_port, comm, pid, ppid, uid, mnt_ns_id on every connect().
#
# This file is the SOURCE OF TRUTH for network rule matching, severity, and
# check order (CRITICAL → LOW, validated at load).
#
# Schema: see rules/process.yaml. Network-specific primitives:
#   dst_ip_not_in:  dst IP is OUTSIDE every CIDR in the list (external traffic)
#   dst_port_in:    dst port equals any list item
#   service_in:     resolved workload service name equals any list item
#
# FUTURE FIELD (not needed by any current rule): Falco/Tetragon also expose the
# connection's L4 protocol (fd.l4proto — tcp/udp) at this same hook point; we don't
# capture it. No rule below needs it today, but it'd be cheap to add later (same
# lsm-connect.bpf.c hook, one more field) for a future behavioral/anomaly project —
# e.g. distinguishing UDP telemetry noise from TCP-based tunneling.

detections:

  # T1041 / T1048 — Exfiltration Over C2 Channel / Alternative Protocol
  # Container connecting to a non-private IP → potential data exfiltration.
  # Exceptions: DNS/NTP/Supabase-pgbouncer ports (allowed_ports) and services
  # with legitimate external APIs (allowed_services — inventory calls CoinGecko).
  # response: block_ip — dst IP added to the blocked_ips LPMTrie before the TCP
  # handshake (outbound only). First connection fires the alert and adds the IP;
  # subsequent connects to it are denied in-kernel. Requires the kernel side:
  # blocked_ips map in lsm-connect.bpf.c + go generate on Linux (skipped with a
  # log line until then — see pkg/detector/response.go blockIP).
  - name: T1041_exfiltration_over_c2
    severity: HIGH
    require_container: true
    match:
      dst_ip_not_in: private_ranges
    exceptions:
      - dst_port_in: allowed_ports
      - service_in: allowed_services
    message: "Container made unauthorized external connection"
    response: block_ip
