rules:

  # ─────────────────────────────────────────────────────────
  # LAYER 1 FILTERS — Persistent Startup Daemons Only (SAFE PATH)
  # ─────────────────────────────────────────────────────────
  # Fast-path filtering at ingest (before enrichment/resolver).
  # Only persistent daemons with verified binary paths.
  # Path validation prevents spoofing (e.g., /tmp/sshd).

  infrastructure_filters:
    # Host system core (systemd family, dbus, SSH, cron)
    # Directory paths (ending /) use prefix match; exact binaries use exact match
    host_system:
      allowed_comms: [systemd, systemd-journald, systemd-resolved, systemd-timesyncd, systemd-networkd, systemd-udevd, systemd-logind, systemd-sysctl, dbus-daemon, sshd, crond, cron]
      trusted_prefixes: [/usr/lib/systemd/, /lib/systemd/, /usr/sbin/sshd, /usr/sbin/crond, /usr/sbin/cron]

    # Docker runtime persistent daemons (cold processes only)
    # runc is spawned dynamically at runtime, handled by Layer 2
    docker_runtime:
      allowed_comms: [dockerd, containerd, containerd-shim, docker-proxy]
      trusted_prefixes: [/usr/bin/, /usr/libexec/docker/, /snap/docker/]

    # Kubernetes node control plane
    kubernetes:
      allowed_comms: [kubelet, kube-proxy, crio]
      trusted_prefixes: [/usr/bin/, /usr/sbin/, /var/lib/minikube/bin/]

    # EDR agent self-protection
    agent:
      allowed_comms: [ebpf-edr]
      trusted_prefixes: [/usr/local/bin/, /opt/]

  # ─────────────────────────────────────────────────────────
  # LAYER 2 PRE-FILTER EXCEPTIONS (Global Drops)
  # ─────────────────────────────────────────────────────────
  # Runs before rule matching engine. If event matches any exception,
  # it's dropped immediately (returns nil). Prevents false positives
  # from legitimate system activity.
  # parent_context types:
  #   - init: ppid == 1 (system initialization phase)
  #   - infrastructure: ppid in safeInfraPIDs (known infrastructure daemon)

  global_exceptions:

    # Package managers during system startup
    # TRADEOFF: Covers legitimate package updates during init. May miss package manager activity
    # spawned via intermediate daemons (custom wrapper scripts). Conservative: only during init.
    - description: "Package manager operations during init (system startup)"
      process_in: [apt-get, apt, dpkg, rpm, yum, apk, pip, npm, yarn]
      parent_context: init
      file_prefixes:
        - /etc/apt/
        - /var/cache/apt/
        - /var/lib/dpkg/
        - /var/lib/apt/
        - /var/lib/rpm/
        - /var/lib/yum/

    # Health checks and network diagnostics from infrastructure
    # SECURITY TRADEOFF: Acceptable risk. If infrastructure daemon is compromised, attacker can
    # execute curl/wget without triggering T1041 exfiltration alerts. Benefit: Eliminates false
    # positives from legitimate health checks (e.g., containerd liveness probes).
    - description: "Health checks spawned by container runtimes"
      process_in: [curl, wget, nc, netcat, ncat]
      parent_context: infrastructure

    # System information queries during startup
    # TRADEOFF: Suppresses T1082 (system info discovery) during init phase. Risk: Attacker in
    # init script could query system files without alerting. Mitigated by Layer 1 infrastructure
    # filtering (shell scripts are not infrastructure).
    - description: "System info discovery tools during init (legitimate startup)"
      process_in: [id, whoami, groups, hostname, uname]
      parent_context: init
      file_prefixes: [/etc/passwd, /etc/group, /etc/os-release]

    # SSH session helper processes (legitimate login activity)
    # TRADEOFF: Allows SSH utilities to operate without triggering T1059 alerts. Mitigated by
    # parent_context: infrastructure (only from sshd daemon, which is in Layer 1 infrastructure).
    - description: "SSH session utilities (login, shell setup, etc.)"
      process_in: [bash, sh, dash, zsh, login, sshd, ssh-keyscan, ssh-agent]
      parent_context: infrastructure

    # Standard utilities in initialization context
    # TRADEOFF: Allows common tools during init without alerts. Conservative: only ppid==1.
    # Risk: Attacker in init script could use these tools. Mitigated by init phase is short-lived.
    - description: "Common system utilities during startup"
      process_in: [grep, sed, awk, find, ls, cat, cp, mv, head, tail]
      parent_context: init

    # Privilege escalation tools reading authentication files
    # TRADEOFF: su/sudo allowed only for auth-related files (/etc/passwd, /etc/shadow, /etc/pam.d/).
    # Not allowed for SSH keys, secrets, or cron configs. Focused exception minimizes false negatives
    # while blocking credential access attacks (T1552, T1003).
    - description: "su/sudo reading system user/group database for authentication"
      process_in: [su, sudo]
      file_prefixes: [/etc/passwd, /etc/group, /etc/shadow, /etc/pam.d/]

  # ─────────────────────────────────────────────────────────
  # LISTS — Reusable collections
  # ─────────────────────────────────────────────────────────

  lists:

    # Shell binaries — full paths to shell interpreters.
    # Two detection paths for shell execution (different attack signals):
    #   1. Exec path (proc.name): catches when shell process is SPAWNED
    #   2. File path (fd.name): catches when shell BINARY is ACCESSED
    # Currently: Exec path is primary (detects T1059 instantly when process starts).
    # Future behavioral detection: File path deviations (shell accessed from /tmp vs /bin).
    - name: shell_binaries
      items: [/bash, /sh, /zsh, /dash]

    # Shell processes — process names (without path) of shell interpreters.
    # Used in exec detection: proc.name in (shell_processes)
    # eBPF captures: when execsnoop (eBPF) traces execve() syscall
    # Signal: shell process spawned in container (T1059 remote code execution).
    - name: shell_processes
      items: [bash, sh, zsh, dash]

    # Network recon tools — raw socket utilities used for scanning.
    # Presence in container indicates network reconnaissance.
    - name: network_tools
      items: [nc, ncat, wget]

    # Container management tools — docker, kubectl, etc.
    # T1613 — executing from inside container indicates resource discovery.
    - name: container_mgmt_tools
      items: [kubectl, docker, crictl, ctr, podman]

    # SSH key directories — where private keys are typically stored.
    # T1552.004 — reading these is CRITICAL credential access attempt.
    - name: ssh_key_dirs
      items: [/root/.ssh/, /home/.ssh/]

    # SSH key file suffixes — specific private key file names.
    # T1552.004 — patterns to match private keys by extension.
    - name: ssh_key_suffixes
      items: [.key, .pem, id_rsa, id_ed25519]

    # Credential file directories — Docker secrets mount.
    # T1552.001 — where application secrets may be stored.
    - name: credential_file_dirs
      items: [/run/secrets/]

    # Credential file suffixes — .env files containing secrets.
    # T1552.001 — environment variables often contain passwords.
    - name: credential_file_suffixes
      items: [.env]

    # Credential dump files — /etc/shadow (password hashes).
    # T1003.008 — CRITICAL severity. No legitimate app reads this at runtime.
    - name: credential_dump_paths
      items: [/etc/shadow]

    # System info discovery files — /etc/passwd, /etc/group.
    # T1082 — MEDIUM severity. System tools may read for normal operation.
    - name: system_info_paths
      items: [/etc/passwd, /etc/group]

    # Recon file readers — tools whose reading of system_info_paths is a discovery
    # signal (T1082). /etc/passwd and /etc/group are world-readable and read constantly
    # by libc NSS (getpwuid/getgrgid), so the app's OWN process reading them is benign —
    # only fire T1082 when one of these recon/dump tools (or a shell) reads them. This
    # kills the /etc/passwd false-positive storm from normal service startup while still
    # catching `cat /etc/passwd`-style discovery.
    - name: recon_file_readers
      items: [cat, tac, nl, head, tail, more, less, grep, egrep, fgrep, awk, sed, cut,
              sort, uniq, strings, xxd, od, hexdump, base64, getent, id, whoami, groups,
              sh, bash, dash, zsh, ash, ksh]

    # Cron configuration files — persistence mechanism.
    # T1053.003 — containers should never access cron files.
    - name: cron_paths
      items:
        - /etc/cron.d/
        - /etc/cron.hourly/
        - /etc/cron.daily/
        - /etc/cron.weekly/
        - /etc/cron.monthly/
        - /var/spool/cron/
        - /etc/crontab

    # Shell history files — attacker covers tracks.
    # T1070.003 — accessing these indicates cleanup of evidence.
    - name: shell_history_suffixes
      items: [.bash_history, .zsh_history, .ash_history, .sh_history]

    # Container filesystem paths — Docker overlay layers.
    # T1611 — reading these indicates escape to host filesystem.
    - name: container_fs_paths
      items: [/var/lib/docker/overlay2/, /run/containerd/]

    # Host init process directory — /proc/1/ accessible only from host.
    # T1611 — container reading this indicates namespace escape attempt.
    - name: proc_escape_paths
      items: [/proc/1/]

    # Allowed /proc/1/ reads — stat, status, cmdline, mountinfo are read-only.
    # Monitoring tools (prometheus, redis) and ischroot legitimately read these.
    - name: proc_escape_allowed
      items: [/proc/1/stat, /proc/1/status, /proc/1/cmdline, /proc/1/mountinfo]

    # Suspicious binary paths — where executables shouldn't be.
    # T1036 — masquerading detects binaries running from writable directories.
    - name: suspicious_exec_paths
      items: [/tmp/, /dev/shm/, /var/tmp/, /run/user/]

    # Ephemeral processes — short-lived utilities spawned by infrastructure for health checks or admin tasks.
    # System container detection tools — admin tools that probe namespace boundaries.
    # T1611 escape detection: medium confidence (legitimate but monitor for abuse).
    # Examples: ps (process listing), apparmor_parser (AppArmor configuration).
    - name: system_container_detection_tools
      items: [ps, apparmor_parser]

    # Universal system tools — safe to skip in ANY environment.
    # These are eBPF capture artifacts or universal utilities (not real threats).
    # Example: fd (symlink resolution quirk in /proc/self/fd capture).
    - name: universal_system_tools
      items: [fd]

    # Container runtime executables — runc, containerd-shim, etc.
    # These are core infrastructure tools that may appear in unknown namespaces.
    # Excluded from T1611 escape detection to prevent false positives.
    - name: container_runtime_execs
      items: [runc, containerd-shim, containerd-shim-runc-v2, dockerd, containerd, docker, ls, debian-sa1, droplet-agent, do-agent]

    # Trusted parent names — processes allowed to spawn transient utilities
    # (health checks, deploy scripts, SSH session tooling) without alerting.
    # Checked against the LIVE ancestry cache: parent identity is the exec-time
    # path captured in-kernel, so it stays valid after the parent exits, and the
    # path is validated against Layer 1 trusted_prefixes to prevent spoofing
    # (a /tmp/dockerd does not match). Used by parent_context: infrastructure
    # and the T1611 state=unknown path. If the direct parent is a shell
    # (shell_processes), the check hops once to the grandparent.
    # Design: docs/DESIGN-PROCESS-ANCESTRY-CACHE.md §3.5
    - name: trusted_parent_names
      items: [containerd-shim, containerd-shim-runc-v2, dockerd, containerd, docker-proxy, runc, sshd, systemd, snapd, snap, cron,
              kubelet, kube-proxy, crio, conmon]

    # Docker lifecycle and deployment tools
    # Spawned during docker deploy/destroy, exit too fast for resolver to complete
    # When state=unknown (couldn't resolve before process exited), these should not trigger T1611
    - name: docker_lifecycle_tools
      items: [snap, snap-seccomp, snap-confine, snap-exec, docker-compose, getent, dpkg-query, cut, tr, wget, sort, tail, debian-sa1, net-interface-handler, grep, sleep, find, dirname, basename, env, sed, rm, id, ping]

    # eBPF artifact patterns — processes with these path patterns are eBPF symlink resolution artifacts.
    # Safe to ignore: not actual process execution, just kernel introspection.
    # Pattern: /proc/*/fd/* catches /proc/self/fd/6, /proc/1/fd/7, etc.
    - name: proc_fd_patterns
      items: [/proc/*/fd/*]


    # AWS and Azure support (design extensible, currently only validating GCP + DigitalOcean)
    # - name: aws_cloud_agents
    #   items: [amazon-ssm-agent]
    # - name: azure_cloud_agents
    #   items: [waagent]

    - name: digitalocean_cloud_agents
      items: [droplet-agent, do-agent]

    # K8s infrastructure processes — common across all K8s distributions.
    # These run outside pod namespaces (on nodes) but are legitimate.
    - name: k8s_infrastructure_procs
      items:
        - iptables                 # kube-proxy network rules
        - iptables-legacy
        - iptables-restore
        - ip6tables
        - conntrack
        - ip                       # iproute2 — route/addr management
        - kube-proxy               # K8s network proxy
        - systemd-sysctl           # node sysctl configuration
        - bridge-network-interface # udev network bridge setup

    # gcp-specific infrastructure processes.
    # Conditionally merged at runtime when environment is detected as DigitalOcean.
    - name: gcp_cloud_agents
      items: []

    # GKE-specific infrastructure processes.
    # Conditionally merged at runtime when environment is detected as GCP.
    - name: gke_infrastructure_procs
      items: [pause]

    # DigitalOcean-specific infrastructure processes.
    # Conditionally merged at runtime when environment is detected as DigitalOcean.
    - name: digitalocean_infrastructure_procs
      items: []

    # Whitelisted unknown namespace procs — merged from base + environment-specific lists.
    # Built at runtime by combining k8s_infrastructure_procs + environment-specific items.
    - name: compiled_infra_runtime_whitelist
      items: []

    # Customer applications — non-infrastructure apps that should not trigger alerts.
    # Infrastructure processes are in infrastructure_filters (Layer 1).
    # Contextual exceptions (su/sudo, health checks) are in global_exceptions (Layer 2 pre-filter).
    - name: customer_applications
      items: [redis-cli]

    # Whitelisted file access processes — special runc states only.
    # Other processes (curl, id) moved to global_exceptions pre-filter.
    # runc:[2:INIT], runc:[1:CHILD]: special runc states during container initialization.
    - name: whitelisted_file_access_procs
      items: ["runc:[2:INIT]", "runc:[1:CHILD]"]

    # PEM file exclusions — CA bundles, not private keys.
    # Python certifi library and requests load these on every HTTPS request.
    - name: pem_exclude_paths
      items: [/site-packages/, /certifi/]

    # Private IP ranges — RFC 1918 + loopback + link-local.
    # Used to exclude internal connections from external communication detection.
    - name: private_ranges
      items:
        - 127.0.0.0/8           # IPv4 loopback
        - 10.0.0.0/8            # RFC 1918 private
        - 172.16.0.0/12         # RFC 1918 private
        - 192.168.0.0/16        # RFC 1918 private
        - 169.254.0.0/16        # Link-local (APIPA)
        - ::1/128               # IPv6 loopback
        - fc00::/7              # IPv6 unique local
        - fe80::/10             # IPv6 link-local

  # ─────────────────────────────────────────────────────────
  # MACROS — Reusable conditions
  # ─────────────────────────────────────────────────────────

  macros:

    # Spawned shell — process is a shell interpreter.
    # Base condition for T1059 (command & scripting execution).
    - name: spawned_shell
      condition: proc.name in (shell_processes)

    # Is container — workload resolved to a known container/pod.
    # Includes both Docker containers and K8s pods (identified by runtime, not state).
    - name: is_container
      condition: workload.identity.runtime == "docker" || workload.identity.runtime == "k8s"

    # Is unknown namespace — workload state unresolved (potential escape).
    # Process in an unresolved namespace indicates possible escape from container to host.
    # Used for T1611 escape detection. States: unknown = mnt_ns_id not found in resolver cache after grace period.
    - name: is_unknown_namespace
      condition: workload.state == unknown

    # Is customer application — process in customer_applications list.
    # Used as exception: suppress alert if process is a known customer app.
    - name: is_customer_app
      condition: proc.name in (customer_applications)

    # Accessing SSH keys directory — opening /root/.ssh/ or /home/.ssh/.
    # T1552.004 — private key access (CRITICAL severity).
    - name: accessing_ssh_keys_dir
      condition: fd.name in (ssh_key_dirs)

    # Accessing SSH key file — opening .key, .pem, id_rsa, etc.
    # T1552.004 — specific private key file access.
    - name: accessing_ssh_key_file
      condition: fd.name in (ssh_key_suffixes)

    # Accessing credentials file — opening .env files.
    # T1552.001 — credentials stored in plain-text files.
    - name: accessing_credentials_file
      condition: fd.name in (credential_file_suffixes)

    # Accessing sensitive system file — reading passwd, shadow, group.
    # T1082 (discovery) and T1003.008 (credential dumping).
    - name: accessing_sensitive_system_file
      condition: fd.name in (system_info_paths)

    # Accessing cron file — modifying scheduled tasks.
    # T1053.003 — persistence mechanism (containers shouldn't access).
    - name: accessing_cron_file
      condition: fd.name in (cron_paths)

    # Accessing history file — reading/writing shell history.
    # T1070.003 — attacker covering tracks by clearing history.
    - name: accessing_history_file
      condition: fd.name in (shell_history_suffixes)

    # Accessing container filesystem — reading Docker overlay layers.
    # T1611 — escape to host by accessing container's filesystem data.
    - name: accessing_container_fs
      condition: fd.name in (container_fs_paths)

    # Accessing proc escape path — reading /proc/1/ outside allowed files.
    # T1611 — escape attempt via procfs (not allowed read-only files).
    - name: accessing_proc_escape
      condition: fd.name in (proc_escape_paths) and fd.name not_in (proc_escape_allowed)

    # External connection — outbound socket to non-private IP.
    # T1041 — exfiltration over C2 channel.
    - name: external_connection
      condition: evt.type == socket_connect and dst.ip not_in (private_ranges)

    # Suspicious shell in container — container spawned shell process.
    # T1059.004 / T1609 — remote code execution indicator.
    - name: suspicious_shell_in_container
      condition: spawned_shell and is_container

    # Sensitive file access — container accessing credential or system files.
    # Combined condition for T1552 / T1003 / T1082 detection.
    - name: sensitive_file_access
      condition: is_container and (accessing_ssh_keys_dir or accessing_ssh_key_file or accessing_sensitive_system_file)

  # ─────────────────────────────────────────────────────────
  # DETECTIONS — Rules using lists and macros
  # ─────────────────────────────────────────────────────────

  # Process detections (T1059, T1105, T1613, T1036) moved to rules/process.yaml
  # (structured matchers — source of truth for match, severity, order).
  detections:

    # T1552.004 — Unsecured Credentials: Private Keys
    # Container reading SSH keys → credential theft for lateral movement.
    T1552_004_private_keys:
      condition: is_container and (accessing_ssh_keys_dir or accessing_ssh_key_file)
      severity: CRITICAL
      exception_macros: [is_customer_app]
      output: "SSH private key access (file=%fd.name service=%service)"

    # T1552.001 — Unsecured Credentials: Credentials in Files
    # Container reading .env files → credential extraction.
    T1552_001_credentials_in_files:
      condition: is_container and accessing_credentials_file
      severity: HIGH
      output: "Credentials file access (file=%fd.name service=%service)"

    # T1003.008 — OS Credential Dumping
    # Container reading /etc/shadow → password hash extraction.
    T1003_008_os_credential_dumping:
      condition: is_container and fd.name == /etc/shadow
      severity: HIGH
      exception_macros: [is_customer_app]
      output: "Credential dump attempt (file=%fd.name service=%service)"

    # T1082 — System Information Discovery
    # Container reading /etc/passwd, /etc/group → reconnaissance.
    T1082_system_discovery:
      condition: is_container and accessing_sensitive_system_file
      severity: MEDIUM
      exception_macros: [is_customer_app]
      output: "System info discovery (file=%fd.name service=%service)"

    # T1053.003 — Scheduled Task/Job: Cron
    # Container accessing /etc/cron.d/, /var/spool/cron/ → persistence.
    T1053_003_scheduled_task:
      condition: is_container and accessing_cron_file
      severity: HIGH
      output: "Cron file access (file=%fd.name service=%service)"

    # T1070.003 — Indicator Removal: Clear Command History
    # Container accessing .bash_history, .zsh_history → covering tracks.
    T1070_003_clear_history:
      condition: is_container and accessing_history_file
      severity: MEDIUM
      output: "History file access (file=%fd.name service=%service)"

    # T1611 — Escape to Host (Filesystem)
    # Container reading /var/lib/docker/overlay2/, /run/containerd/ → escape.
    T1611_escape_host_fs:
      condition: is_container and accessing_container_fs
      severity: CRITICAL
      output: "Container escape attempt - filesystem (file=%fd.name service=%service)"

    # T1611 — Escape to Host (Procfs)
    # Container reading /proc/1/ → accessing host init process (escape).
    T1611_escape_host_proc:
      condition: is_container and accessing_proc_escape
      severity: HIGH
      output: "Container escape attempt - procfs (file=%fd.name service=%service)"

    # T1611 — Escape to Host (Namespace)
    # Process in an unknown namespace (should be inside a pod/container NS).
    # SUPERSEDED (Phase 3 / §3.6): a bare unresolved namespace is NOT treated as an
    # escape any more. "Unknown" is a resolver-timing artifact, not a threat signal
    # (Falco has no equivalent). Runtime behavior (Go, source of truth):
    #   - ancestry roots in verified infrastructure (isParentTrusted — Layer 1 PIDs +
    #     ancestry-cache walk with trusted-path validation) → suppressed;
    #   - eBPF capture artifacts (proc_fd_patterns, universal_system_tools) → suppressed;
    #   - everything else → LOW EDR_telemetry_unresolved_namespace (below), not CRITICAL.
    # Real escape detection lives in the behavioral/file T1611 rules (fs, proc). This
    # entry is retained only as the technique reference. See §3.5–3.6.
    T1611_escape_host_ns:
      condition: is_unknown_namespace
      severity: LOW
      exception_macros: [is_customer_app]
      output: "Container escape attempt - namespace (proc=%proc.name service=%service)"

    # EDR_telemetry_unresolved_namespace — active routing target for Phase 3.
    # Visibility gap: namespace never resolved AND ancestry could not be verified as
    # infrastructure. Not a security alert — a validation breadcrumb (resolver timeouts,
    # capacity issues, fork-without-exec gaps). Emitted at LOW so it still reaches the
    # log / dashboard / Supabase for tuning, without CRITICAL noise.
    EDR_telemetry_unresolved_namespace:
      condition: is_unknown_namespace
      severity: LOW
      output: "EDR visibility gap: Process in unresolved namespace (proc=%proc.name pid=%proc.pid)"

    # T1041 / T1048 — Exfiltration Over C2 Channel / Alternative Protocol
    # Container making external connection → potential data exfiltration.
    T1041_exfiltration_over_c2:
      condition: is_container and external_connection
      severity: HIGH
      exception_macros: [is_customer_app]
      output: "External connection from container (dst=%dst.ip:%dst.port service=%service)"

  # ─────────────────────────────────────────────────────────
  # NETWORK POLICY
  # ─────────────────────────────────────────────────────────

  network:
    # Allowed destination ports — services that all containers may connect to.
    # 53 — DNS (legitimate system traffic, exclude from T1041 exfiltration alerts).
    # 123 — NTP (time synchronization, exclude from T1041).
    # 6543 — Supabase pgbouncer (all health-ai services use Supabase).
    allowed_ports:
      - 53
      - 123
      - 6543

    # Allowed services — services permitted to make external connections.
    # These services have legitimate reasons to call external APIs.
    # inventory-service calls CoinGecko for live market data.
    allowed_services:
      - inventory-service
      - inventory_service

  # ─────────────────────────────────────────────────────────
  # SYSTEM NAMESPACES (suppress alerts)
  # ─────────────────────────────────────────────────────────

  # Namespaces that generate constant false positive noise.
  # These are K8s infrastructure, not user workloads.
  ignore_namespaces:
    - kube-system      # K8s system namespace (kubelet, coredns, kube-proxy)
    - gmp-system       # Google Managed Prometheus
    - gke-managed-cim  # GKE managed services
