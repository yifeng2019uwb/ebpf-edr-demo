# Note: Secret and ConfigMap are created by k8s/deploy.sh from k8s/.env
# This file defines only the DaemonSet that consumes them
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ebpf-edr
  namespace: kube-system
  labels:
    app: ebpf-edr
spec:
  selector:
    matchLabels:
      app: ebpf-edr
  template:
    metadata:
      labels:
        app: ebpf-edr
    spec:
      hostPID: true
      hostNetwork: true
      tolerations:
      - operator: Exists  # run on all nodes regardless of taints
      containers:
      - name: ebpf-edr
        image: ghcr.io/yifeng2019uwb/ebpf-edr:latest
        imagePullPolicy: Always
        args: ["--runtime", "k8s"]
        env:
        # K8s cluster/region info
        - name: REGION
          value: "${REGION}"
        - name: CLUSTER_NAME
          value: "${CLUSTER_NAME}"
        - name: CONTAINER_RUNTIME_ENDPOINT
          value: unix:///run/containerd/containerd.sock
        # Durable alert log on the node hostPath (survives pod restarts).
        # Value comes from the ebpf-alerts ConfigMap (deploy.sh builds it from .env),
        # same as DATABASE_URL/PUBSUB_ADDR. Must resolve to the `alerts` volumeMount
        # below (/alerts → /var/log/ebpf-edr). optional: if the key is absent the binary
        # falls back to its default path (alerts/alert.log) instead of failing to start.
        - name: ALERT_LOG_PATH
          valueFrom:
            configMapKeyRef:
              name: ebpf-alerts
              key: alert-log-path
              optional: true
        # Alert infrastructure (from ConfigMap)
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: ebpf-alerts
              key: database-url
        # Supavisor pooler region (e.g. 0-us-east-1) — selects the IPv4 pooler endpoint
        # aws-<region>.pooler.supabase.com. Required on DO nodes: no IPv6 route to the
        # direct db.<project>.supabase.co endpoint. optional: when unset the sink falls
        # back to the direct endpoint (works where an IPv4 route exists).
        - name: DATABASE_REGION
          valueFrom:
            configMapKeyRef:
              name: ebpf-alerts
              key: database-region
              optional: true
        - name: PUBSUB_ADDR
          valueFrom:
            configMapKeyRef:
              name: ebpf-alerts
              key: pubsub-addr
        # Alert infrastructure secrets (from Secret)
        - name: DATABASE_KEY
          valueFrom:
            secretKeyRef:
              name: ebpf-alerts
              key: database-key
        - name: PUBSUB_KEY
          valueFrom:
            secretKeyRef:
              name: ebpf-alerts
              key: pubsub-key
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: proc
          mountPath: /proc
          readOnly: true
        - name: btf
          mountPath: /sys/kernel/btf
          readOnly: true
        - name: containerd-sock
          mountPath: /run/containerd/containerd.sock
        - name: alerts
          mountPath: /alerts
        - name: debugfs
          mountPath: /sys/kernel/debug
        - name: tracefs
          mountPath: /sys/kernel/tracing
      volumes:
      - name: proc
        hostPath:
          path: /proc
      - name: btf
        hostPath:
          path: /sys/kernel/btf
      - name: containerd-sock
        hostPath:
          path: /run/containerd/containerd.sock
      - name: alerts
        hostPath:
          path: /var/log/ebpf-edr
          type: DirectoryOrCreate
      - name: debugfs
        hostPath:
          path: /sys/kernel/debug
      - name: tracefs
        hostPath:
          path: /sys/kernel/tracing
